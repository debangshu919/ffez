[package]
name = "ffez"
version = "0.1.0"
authors = ["Debangshu Das <personal.debangshu444@gmail.com>"]
edition = "2024"
description = "A minimal FFmpeg CLI wrapper built for your everyday audio and video tasks.  "
repository = "https://github.com/debangshu919/ffez"
license = "MIT OR Apache-2.0"
keywords = [
    "ffmpeg",
    "video",
    "audio",
    "tool"
]
categories = ["command-line-utilities"]

[[bin]]
name = "ffez"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
bytesize = "2.7.0"
thiserror = "2.0.21"
tempfile = "3.27.0"
which = "8.0.6"

[dev-dependencies]
assert_cmd = "2"

[profile.dev]
opt-level = 0
incremental = true

[profile.release]
opt-level = 3
strip = "symbols"
lto = true
debug = false
[package]
name = "ffez"
version = "0.1.0"
authors = ["Debangshu Das <personal.debangshu444@gmail.com>"]
edition = "2024"
description = "A ffmpeg wrapper built for your everyday tasks"
repository = "https://github.com/debangshu919/ffez"
license = "MIT"
keywords = [
    "ffmpeg",
    "video",
    "audio",
    "tool"
]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
bytesize = "2.7.0"
thiserror = "2.0.21"
tempfile = "3.27.0"
which = "8.0.6"

[dev-dependencies]
assert_cmd = "2"